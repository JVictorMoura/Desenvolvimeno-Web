<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="a">
    <button
    onclick="fors();"
    >asdasd</button>
    <p class="triangulo"></p>

    
    <script>
        const userChoice = document.getElementById('a');
        let t = document.querySelector('.triangulo');
        function fors(){
            t.innerHTML = ""
            let a = userChoice.value;
            for(let i = 0; i<=a; i++){
                
                for(let j = 0;j < i; j++){
                    t.innerHTML += '*';
                }
                t.innerHTML += '<br>';
            }
            
        }
        
    </script>
</body>
</html>
