<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input {
            width: 120px;
        }

        button {
            width: 50px;
            height: auto;
            margin-top: 10px;
        }

        .div {
            display: flex;
        }

        body {
            position: fixed;
            left: 0px;
            right: 0px;
            bottom: 0px;
            top: 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div>
        <h1>adivinhe o número</h1>
    </div>
    <div>
        <p>Escolha um valor de 1 a 20</p>
    </div>

    <div class="div">
        <input type="number" min="1" max="20" id="input" placeholder="digite um numero"></div>
        <div>
        <button class="accept" onclick="choice();">Tentar</button></div>
    
    <p class="result text"></p>
    <p class="computer text"></p>



    <script>
        let computerChoice = Number(Math.floor(Math.random() * (21 - 1 + 1)) + 1);

        function choice() {
            let value = Number(document.getElementById('input').value);
            let result = document.querySelector('.result');
            result.innerHTML = ("");

            if (value > 20 || value < 1) {
                result.innerHTML = ("escolheu um numero invalido");

            }
            else {
                if (computerChoice === value) {
                    result.innerHTML = ("escolheu o mesmo, boa!");
                } else {
                    if (value < computerChoice) {
                        result.innerHTML = ('seu numero é menor');
                    }
                    else {
                        result.innerHTML = ('seu numero é maior');
                    }

                }

            }
            console.log(computerChoice);
        }
    </script>
</body>

</html>
