<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            width: 100px;
        }
        button{
            margin-left: 50px;
            width: 50px;
            height: auto;
        }
        div{
            display: flex;
        }

    </style>
</head>

<body>
    <h1>adivinhe o número</h1>
    <p>Escolha um valor de 1 a 20</p>
    <div>
        <input type="number" min="1" max="20" id="input">
        <button class="accept" onclick="choice();"></button>
    </div>
    <p class="result text"></p>
    <p class="computer text"></p>



    <script>

        function choice() {
            let computerChoice = Number(Math.floor(Math.random() * (21 - 1 + 1)) + 1);

            const value = Number(document.getElementById('input').value);
            let result = document.querySelector('.result');
            result.innerHTML = ("");

            if (value > 20 || value < 1) {
                result.innerHTML = ("escolheu um numero invalido");

            }
            else {
                if (computerChoice === value) {
                    let computerObject = document.querySelector('.computer').innerHTML = ("escolheu o mesmo, boa");
                }else{   
                    let computerObject = document.querySelector('.computer').innerHTML = ("errou, pae");
                }
                console.log(computerChoice);
            }
            

        }
    </script>
</body>

</html>
