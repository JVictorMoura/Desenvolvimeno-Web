<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

<h1>Calculadora de Abastecimento</h1>
<hr>
<p>Escolha o tipo de combustível e a quantidade de litros</p>
<p>tabela de preços</p>
<ul>
    <li>Gasolina: R$ 6,69</li>
    <li>Etanol: R$ 4,30</li>
    <li>Diesel: R$ 6,03</li>
</ul>
<form id="form">
    <label for="combustivel">Tipo combustivel</label>
        <select name="combustivel" id="combustivel">
            <option value="">Escolha ma opcao</option>
            <option value="gasolina">Gasolina</option>
            <option value="etanol">Etanol</option>
            <option value="diesel">Diesel</option>
        </select>
        <label for="Litros">Quantidade</label>
        <input id="litros" type="number" min="0" step="0.1">
</form>
<h2>Resultado</h2>
<p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
